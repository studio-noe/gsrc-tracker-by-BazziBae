name: Marathon Auto Scraper

on:
  schedule:
    # GitHub 스케줄은 최소 5분이고 혼잡하면 더 밀린다. 1분으로 적어도 그대로 돌지 않는다
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 실행이 겹치면 push 가 충돌한다
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 에 Node 가 이미 깔려 있고 fetch 도 내장이라 설치 단계가 없다
      - name: Run scraper
        run: node scraper.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || {
            git commit -m "Auto-update runner data"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          }
